<main class="wrap article-main"><article><header class="article-header"><a class="back-link" href="/archives/">← 返回上一页</a><div class="article-meta"><time datetime="2024-09-19T15:41:13.000Z">2024 年 09 月 19 日</time><span>·</span><span><a href="/categories/%E7%A0%81%E4%B8%8D%E8%83%BD%E5%81%9C/">码不能停</a> / <a href="/categories/%E7%A0%81%E4%B8%8D%E8%83%BD%E5%81%9C/php/">php</a></span></div><h1>Mac 用 Brew 安装旧版本 PHP</h1></header><div class="prose"><p>最近又用到 php7.4，奈何本地早就已经升到了 8，想搞回来，发现一个简单好用爽歪歪的三方库，需要的可以试一下，5.6 - 8.4 都有。<a target="_blank" rel="noopener" href="https://github.com/shivammathur/homebrew-php">[ homebrew-php ] </a></p>
<h1 id="添加地址库"><a href="#添加地址库" class="headerlink" title="添加地址库"></a>添加地址库</h1><figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">brew tap shivammathur/php</span><br></pre></td></tr></table></figure>

<h1 id="安装指定版本"><a href="#安装指定版本" class="headerlink" title="安装指定版本"></a>安装指定版本</h1><figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">brew install shivammathur/php/php@7.4</span><br></pre></td></tr></table></figure>

<h1 id="切换版本"><a href="#切换版本" class="headerlink" title="切换版本"></a>切换版本</h1><figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br></pre></td><td class="code"><pre><span class="line">brew services stop php@7.4</span><br><span class="line">brew unlink php@xx</span><br><span class="line"></span><br><span class="line">brew link php@7.4</span><br><span class="line">brew services start php@7.4</span><br></pre></td></tr></table></figure>

<p>搞定收工。</p>
<p><img src="/images/php-v-7.4.png" alt="M系列"></p>
