<main class="wrap article-main"><article><header class="article-header"><a class="back-link" href="/archives/">← 返回上一页</a><div class="article-meta"><time datetime="2021-03-21T06:35:13.000Z">2021 年 03 月 21 日</time><span>·</span><span><a href="/categories/%E8%AE%BE%E8%AE%A1%E6%A8%A1%E5%BC%8F/">设计模式</a></span></div><h1>php 和设计模式 - 注册模式</h1></header><div class="prose"><p>注册模式通常将对象注册到一个全局的对象树上，需要的时候从对象树上取下需要的实例，就像卖糖葫芦的有木有。不过不一样的是糖葫芦会摘完，对象树摘下后并不会销毁该对象。</p>
<p>注册模式通常通过一个只有静态方法的抽象类来存放这些对象。或者通过单例模式。</p>
