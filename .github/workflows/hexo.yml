name: Hexo Deploy

on:
  push:
    branches:
      - hexo
  schedule:
    # 每天北京时间 08:55，同步当天已生成的日报并部署。
    # GitHub 只在默认分支执行 schedule；需将仓库默认分支设为 hexo。
    - cron: "55 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "指定要同步的日报日期（YYYY-MM-DD，留空为当天或最近一期）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: hexo-pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Use Python 3.12
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync AI daily post
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python tools/sync_ai_daily.py --date "${{ inputs.date }}"
          else
            python tools/sync_ai_daily.py
          fi
      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      # 主题文件夹，如果你的主题不是 git submodule 可以不配置
      - name: Checkout theme repo
        uses: actions/checkout@v3
        with:
          repository: winmin/hexo-theme-Bloom
          ref: main
          path: themes/Bloom
      - name: Cache NPM dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.OS }}-npm-cache
          restore-keys: |
            ${{ runner.OS }}-npm-cache
      - name: Install Dependencies
        run: |
          npm install
          npm install hexo-renderer-ejs hexo-renderer-stylus hexo-generator-search hexo-wordcount hexo-generator-feed hexo-douban hexo-generator-sitemap hexo-generator-baidu-sitemap
      - name: Build
        run: npm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
      - name: Archive daily post
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "m-finder-daily-bot"
          git config user.email "m-finder-daily-bot@users.noreply.github.com"
          git add source/_posts/ai-daily-*.md
          if git diff --staged --quiet; then
            echo "没有新增日报文章"
            exit 0
          fi
          git commit -m "chore: 同步 AI 日报"
          git push
