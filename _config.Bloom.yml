# ==========================================
# Bloom Theme Configuration
# ==========================================

# ---- Navigation Menu ----
nav:
  首页: /
  时间线: /archives/
  标签: /tags/
  分类: /categories/
  说说: /shuo/
  相册: /gallery/
  友情链接: /link/
  关于: /about/
  RSS: /atom.xml

# ---- Profile / Intro ----
profile:
  enabled: true
  avatar: /images/avatar.jpeg
  gravatar_email: ""
  title: "M-finder"
  subtitle: "删繁就简，发现更多"
  description: "Happy Coding"

# ---- Homepage Columns (Core Feature) ----
# Enable categorized columns on homepage
# Max 2 columns supported
columns:
  enabled: true
  layout: two-column           # single-column | two-column
  items:
    - name: 闲言赘语           # Display name
      category: 闲言赘语       # Category slug
      limit: 50                # Number of posts to show
      show_date: true
    - name: 码不能停
      category: 码不能停
      limit: 50
      show_date: true

# Fallback when columns disabled
default_list:
  title: "最近更新"
  limit: 50
  show_date: true

# ---- Search ----
search:
  enabled: true
  path: search.xml
  placeholder: "搜索..."

# ---- Social Links ----
social:
  github: "https://github.com/m-finder"
  twitter: ""
  email: "mailto:yf-wu@qq.com"
  rss: /atom.xml

# ---- Footer ----
footer:
  copyright_since: 2016
  powered_by: true
  theme_info: true

# ---- Appearance ----
colorscheme: dark

# ---- Layout Width ----
layout:
  page_width: 60          # 整体页面最大宽度 (rem)
  content_width: 900      # 文章内容区宽度 (px)
  mobile_padding: 12      # 移动端两侧边距 (px)

# ---- Logo ----
logo:
  enabled: false
  image: /images/logo.png
  width: 100
  height: 100

# ---- Post Settings ----
post:
  show_updated: true
  show_wordcount: true
  show_readtime: true
  excerpt_link: "Read More"
  toc: true

# ---- Code Highlight ----
highlight:
  theme: tomorrow-night
  copy_button: true

# ---- Comments ----
comments:
  enabled: true
  provider: "giscus"                 # disqus | utterances | giscus
  disqus:
    shortname: "m-finder"
  utterances:
    repo: ""
    issue_term: pathname
  giscus:
    repo: "m-finder/m-finder.github.io"
    repo_id: "MDEwOlJlcG9zaXRvcnkxMjEzNzU5NTc="
    category: "Announcements"
    category_id: "DIC_kwDOBzwM1c4DIlfb"

# ---- Analytics ----
analytics:
  google: ""
  baidu: ""

# ---- 404 Page ----
error_404:
  enabled: true
  title: "Page Not Found"
  description: "The page you're looking for doesn't exist."
