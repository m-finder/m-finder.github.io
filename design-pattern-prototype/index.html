<main class="wrap article-main"><article><header class="article-header"><a class="back-link" href="/archives/">← 返回上一页</a><div class="article-meta"><time datetime="2021-03-21T06:35:06.000Z">2021 年 03 月 21 日</time><span>·</span><span><a href="/categories/%E8%AE%BE%E8%AE%A1%E6%A8%A1%E5%BC%8F/">设计模式</a></span></div><h1>php 和设计模式 - 原型模式</h1></header><div class="prose"><p>原型模式通常用于大对象的创建。因为每次 new 一个对象会造成很大开销，原型模式仅需内存拷贝即可。</p>
<p>比较简单，直接上🌰：</p>
<figure class="highlight php"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br></pre></td><td class="code"><pre><span class="line"><span class="class"><span class="keyword">interface</span> <span class="title">Book</span></span></span><br><span class="line"><span class="class"></span>&#123;</span><br><span class="line">    <span class="keyword">public</span> <span class="function"><span class="keyword">function</span> <span class="title">setTitle</span>(<span class="params"><span class="keyword">string</span> <span class="variable">$title</span></span>)</span>;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">public</span> <span class="function"><span class="keyword">function</span> <span class="title">getTitle</span>(<span class="params"></span>): <span class="title">string</span></span>;</span><br><span class="line">&#125;</span><br><span class="line"></span><br><span class="line"><span class="class"><span class="keyword">class</span> <span class="title">eBook</span> <span class="keyword">implements</span> <span class="title">Book</span></span></span><br><span class="line"><span class="class"></span>&#123;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">protected</span> <span class="keyword">string</span> <span class="variable">$title</span>;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">public</span> <span class="function"><span class="keyword">function</span> <span class="title">setTitle</span>(<span class="params"><span class="keyword">string</span> <span class="variable">$title</span></span>)</span></span><br><span class="line"><span class="function">    </span>&#123;</span><br><span class="line">        <span class="variable language_">$this</span>-&gt;title = <span class="variable">$title</span>;</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="keyword">public</span> <span class="function"><span class="keyword">function</span> <span class="title">getTitle</span>(<span class="params"></span>): <span class="title">string</span></span></span><br><span class="line"><span class="function">    </span>&#123;</span><br><span class="line">        <span class="keyword">return</span> <span class="variable language_">$this</span>-&gt;title;</span><br><span class="line">    &#125;</span><br><span class="line">&#125;</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="variable">$book1</span> = <span class="keyword">new</span> <span class="title function_ invoke__">eBook</span>();</span><br><span class="line"><span class="variable">$book1</span>-&gt;<span class="title function_ invoke__">setTitle</span>(<span class="string">&#x27;1 号电子书&#x27;</span>);</span><br><span class="line"><span class="keyword">echo</span> <span class="variable">$book1</span>-&gt;<span class="title function_ invoke__">getTitle</span>(), PHP_EOL;</span><br><span class="line"></span><br><span class="line"><span class="variable">$book2</span> = <span class="keyword">new</span> <span class="title function_ invoke__">eBook</span>();</span><br><span class="line"><span class="variable">$book2</span>-&gt;<span class="title function_ invoke__">setTitle</span>(<span class="string">&#x27;2 号电子书&#x27;</span>);</span><br><span class="line"><span class="keyword">echo</span> <span class="variable">$book2</span>-&gt;<span class="title function_ invoke__">getTitle</span>(), PHP_EOL;</span><br></pre></td></tr></table></figure>


<p>常规情况下，我们会用 new 创建两个对象，然后分别设置各自的书名。现在用原型模式改造一下：</p>
<figure class="highlight php"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br></pre></td><td class="code"><pre><span class="line"><span class="variable">$prototype</span> = <span class="keyword">new</span> <span class="title function_ invoke__">eBook</span>();</span><br><span class="line"></span><br><span class="line"><span class="keyword">foreach</span>(<span class="title function_ invoke__">range</span>(<span class="number">1</span>, <span class="number">10</span>) <span class="keyword">as</span> <span class="variable">$index</span>)&#123;</span><br><span class="line">    <span class="variable">$book</span> = <span class="keyword">clone</span> <span class="variable">$prototype</span>;</span><br><span class="line">    <span class="variable">$book</span>-&gt;<span class="title function_ invoke__">setTitle</span>(<span class="variable">$index</span>. <span class="string">&#x27; 号电子书&#x27;</span>);</span><br><span class="line">    <span class="keyword">echo</span> <span class="variable">$book</span>-&gt;<span class="title function_ invoke__">getTitle</span>(), PHP_EOL;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>

<p>类保持不变，只在创建时该用 clone 即可。</p>
