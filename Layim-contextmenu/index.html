<main class="wrap article-main"><article><header class="article-header"><a class="back-link" href="/archives/">← 返回上一页</a><div class="article-meta"><time datetime="2017-12-27T01:40:33.000Z">2017 年 12 月 27 日</time><span>·</span><span><a href="/categories/%E7%A0%81%E4%B8%8D%E8%83%BD%E5%81%9C/">码不能停</a></span></div><h1>Layim模块化右键菜单</h1></header><div class="prose"><p>一直觉得社区那群“先驱”搞的右键菜单要么太丑，要么风格不统一，很难受。</p>
<p>这两天仔细看了看心姐的源码，把历史消息里的右键菜单揪出来改了一把，感觉很良好。</p>
<p>演示地址已挂，请在本地搭建后测试。</p>
<p>调用方法，先引用上边暴露出来的方法，然后：</p>
